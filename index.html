<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Support us</title>
<style>
  :root {
    --bg: #f6f4ef; --card: #ffffff; --ink: #1d2433; --muted: #5d6677;
    --line: #e2ded4; --accent: #0b6bcb; --accent-ink: #ffffff; --soft: #eaf2fb;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151c; --card: #1b2029; --ink: #eef1f6; --muted: #a3acbb;
      --line: #2c3340; --accent: #5aa9f5; --accent-ink: #0c1420; --soft: #1f2a3a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    padding: 24px 16px; background: var(--bg); color: var(--ink);
    font: 17px/1.55 system-ui, -apple-system, "Segoe UI", "Heebo", Arial, sans-serif;
  }
  main {
    width: 100%; max-width: 440px; background: var(--card);
    border: 1px solid var(--line); border-radius: 20px; padding: 28px 24px;
  }
  .top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
  .heart { font-size: 30px; line-height: 1; }
  .lang {
    background: none; border: 1px solid var(--line); color: var(--muted);
    border-radius: 999px; padding: 6px 14px; font: inherit; font-size: 14px; cursor: pointer;
  }
  h1 { margin: 0 0 8px; font-size: 28px; line-height: 1.2; text-wrap: balance; }
  p { margin: 0 0 20px; color: var(--muted); }
  .amounts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 10px; }
  .amounts button {
    padding: 14px 0; border-radius: 12px; border: 1px solid var(--line);
    background: var(--card); color: var(--ink); font: inherit; font-weight: 600;
    font-variant-numeric: tabular-nums; cursor: pointer;
  }
  .amounts button[aria-pressed="true"] { border-color: var(--accent); background: var(--soft); }
  label { display: block; font-size: 14px; color: var(--muted); margin-bottom: 6px; }
  .custom { display: flex; align-items: center; gap: 8px; margin-bottom: 20px; }
  .custom span { font-weight: 600; }
  .custom input {
    flex: 1; min-width: 0; padding: 12px; border-radius: 12px; border: 1px solid var(--line);
    background: var(--card); color: var(--ink); font: inherit;
  }
  .give {
    width: 100%; padding: 15px; border: 0; border-radius: 12px; background: var(--accent);
    color: var(--accent-ink); font: inherit; font-weight: 700; font-size: 18px; cursor: pointer;
  }
  .give:disabled { opacity: .5; cursor: default; }
  button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .note { margin: 14px 0 0; font-size: 13px; text-align: center; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <div class="top">
    <span class="heart" aria-hidden="true">💙</span>
    <button class="lang" id="lang" type="button"></button>
  </div>

  <section id="give">
    <h1 id="title"></h1>
    <p id="text"></p>
    <div class="amounts" id="amounts"></div>
    <label for="custom" id="customLabel"></label>
    <div class="custom">
      <span id="symbol"></span>
      <input id="custom" type="number" inputmode="decimal" min="1" max="100000" step="1">
    </div>
    <button class="give" id="donate" type="button"></button>
    <p class="note" id="note"></p>
  </section>

  <section id="thanks" hidden>
    <h1 id="thanksTitle"></h1>
    <p id="thanksText"></p>
  </section>
</main>

<script src="config.js"></script>
<script>
(function () {
  var cfg = window.SUPPORT_CONFIG;
  var q = new URLSearchParams(location.search);

  // Which app sent the visitor. Only a safe slug is accepted.
  var rawApp = (q.get("app") || "").toLowerCase();
  var app = /^[a-z0-9-]{1,40}$/.test(rawApp) ? rawApp : "unknown";

  var qLang = (q.get("lang") || "").toLowerCase();
  var lang = qLang === "he" || qLang === "en" ? qLang
    : /^(he|iw)/i.test(navigator.language || "") ? "he" : "en";

  var T = {
    he: {
      title: "תתמכו בנו",
      one: "{app} חינמית ובלי פרסומות. תרומה קטנה עוזרת לנו להמשיך לפתח ולתחזק אותה.",
      all: "האפליקציות שלנו חינמיות ובלי פרסומות. תרומה קטנה עוזרת לנו להמשיך לפתח ולתחזק אותן.",
      custom: "סכום אחר",
      donate: "לתרומה ב-PayPal",
      note: "התשלום מתבצע באתר המאובטח של PayPal.",
      item: "תמיכה ב-{app}",
      itemAll: "תמיכה באפליקציות",
      thanksTitle: "תודה רבה!",
      thanksText: "התמיכה שלך עוזרת לנו להמשיך. אפשר לסגור את העמוד ולחזור לאפליקציה.",
      other: "English",
    },
    en: {
      title: "Support us",
      one: "{app} is free and has no ads. A small donation helps us keep building and maintaining it.",
      all: "Our apps are free and have no ads. A small donation helps us keep building and maintaining them.",
      custom: "Other amount",
      donate: "Donate with PayPal",
      note: "Payment is made on PayPal's secure site.",
      item: "Support {app}",
      itemAll: "Support our apps",
      thanksTitle: "Thank you!",
      thanksText: "Your support keeps us going. You can close this page and go back to the app.",
      other: "עברית",
    },
  };

  var $ = function (id) { return document.getElementById(id); };
  var amount = null;

  function appName() {
    var known = cfg.apps[app];
    return known ? known[lang] : null;
  }

  function track(event, extra) {
    if (!cfg.supabaseUrl || !cfg.supabaseKey) return Promise.resolve();
    var ref = null;
    try { ref = document.referrer ? new URL(document.referrer).hostname.slice(0, 100) : null; } catch (e) {}
    var row = Object.assign({ app: app, event: event, lang: lang, referrer: ref }, extra || {});
    return fetch(cfg.supabaseUrl + "/rest/v1/support_events", {
      method: "POST",
      keepalive: true,
      headers: {
        apikey: cfg.supabaseKey,
        Authorization: "Bearer " + cfg.supabaseKey,
        "Content-Type": "application/json",
        Prefer: "return=minimal",
      },
      body: JSON.stringify(row),
    }).catch(function () {});
  }

  function setAmount(value) {
    amount = value > 0 ? value : null;
    Array.prototype.forEach.call($("amounts").children, function (b) {
      b.setAttribute("aria-pressed", String(Number(b.dataset.value) === amount));
    });
    $("donate").disabled = !amount;
  }

  function render() {
    var t = T[lang], a = cfg.amounts[lang], name = appName();
    document.documentElement.lang = lang;
    document.documentElement.dir = lang === "he" ? "rtl" : "ltr";
    document.title = t.title;
    $("lang").textContent = t.other;
    $("title").textContent = t.title;
    $("text").textContent = name ? t.one.replace("{app}", name) : t.all;
    $("customLabel").textContent = t.custom;
    $("symbol").textContent = a.symbol;
    $("donate").textContent = t.donate;
    $("note").textContent = t.note;
    $("thanksTitle").textContent = t.thanksTitle;
    $("thanksText").textContent = t.thanksText;

    var box = $("amounts");
    box.textContent = "";
    a.presets.forEach(function (v) {
      var b = document.createElement("button");
      b.type = "button";
      b.dataset.value = v;
      b.textContent = a.symbol + v;
      b.addEventListener("click", function () { $("custom").value = ""; setAmount(v); });
      box.appendChild(b);
    });
    $("custom").value = "";
    setAmount(a.selected);
  }

  function paypalUrl() {
    var t = T[lang], a = cfg.amounts[lang], name = appName();
    var back = new URL(cfg.pageUrl);
    back.searchParams.set("app", app);
    back.searchParams.set("lang", lang);
    back.searchParams.set("thanks", "1");
    var p = new URLSearchParams({
      business: cfg.paypalBusiness,
      item_name: name ? t.item.replace("{app}", name) : t.itemAll,
      item_number: app,          // shows the source app on the PayPal transaction
      custom: app,
      amount: amount.toFixed(2),
      currency_code: a.currency,
      no_recurring: "1",
      return: back.toString(),
    });
    return "https://www.paypal.com/donate?" + p.toString();
  }

  $("lang").addEventListener("click", function () {
    lang = lang === "he" ? "en" : "he";
    render();
  });

  $("custom").addEventListener("input", function () {
    setAmount(Math.round(parseFloat(this.value) * 100) / 100 || 0);
  });

  $("donate").addEventListener("click", function () {
    if (!amount) return;
    var url = paypalUrl();
    var sent = track("click", { amount: amount, currency: cfg.amounts[lang].currency });
    // Do not hold the donor back if tracking is slow.
    Promise.race([sent, new Promise(function (r) { setTimeout(r, 500); })])
      .then(function () { location.href = url; });
  });

  render();
  if (q.get("thanks") === "1") {
    $("give").hidden = true;
    $("thanks").hidden = false;
    track("return");
  } else {
    track("view");
  }
})();
</script>
</body>
</html>
